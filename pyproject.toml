[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation for Persian (Farsi) text: normalization, BM25, embeddings, hybrid retrieval and grounded answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aria Esmaeilzadeh" }]
keywords = ["persian", "farsi", "rag", "nlp", "bm25", "retrieval", "llm", "normalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/ariaesm/persian-rag"
Issues = "https://github.com/ariaesm/persian-rag/issues"

[project.scripts]
persian-rag = "persian_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persian_rag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "D"]
ignore = [
    # Persian text legitimately contains characters ruff considers "ambiguous".
    "RUF001", "RUF002", "RUF003",
    # Word lists read better as whitespace-separated strings.
    "SIM905",
    # Docstring style: keep it pragmatic.
    "D100", "D104", "D105", "D107", "D203", "D213", "D413",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
